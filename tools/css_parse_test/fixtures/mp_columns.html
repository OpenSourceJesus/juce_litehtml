<!DOCTYPE html><html><head><style>
#mp-upper { display: flex; }
#mp-left { flex: 1 1 55%; background: #f5fffa; border: 1px solid #cef2e0; }
#mp-right { flex: 1 1 45%; background: #f5faff; border: 1px solid #cedff2; }
.mp-h2 { margin: 0; padding: 4px; }
</style></head><body>
<div id="mp-upper">
  <div id="mp-left"><h2 class="mp-h2">From today's featured article</h2><p>Left column text.</p></div>
  <div id="mp-right"><h2 class="mp-h2">In the news</h2><p>Right column text.</p></div>
</div>
<p>After columns.</p>
</body></html>
