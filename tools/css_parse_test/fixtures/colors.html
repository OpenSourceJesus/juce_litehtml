.g { background: linear-gradient(red, blue); height: 16px; width: 200px; }
.h { color: hsl(120, 100%, 25%); }
.a { background-color: hsla(240, 100%, 50%, 0.5); height: 16px; width: 200px; }
.x { background: #11223344; height: 16px; width: 200px; }
.r { background: rgb(255, 0, 0); height: 16px; width: 200px; }
</style></head><body>
<div class="g"></div><div class="h">hsl</div><div class="a"></div>
<div class="x"></div><div class="r"></div>
</body></html>
