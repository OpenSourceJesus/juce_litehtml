<!DOCTYPE html><html><head><style>
.row { display: flex; background: #eeeeee; padding: 4px; }
.row > div { padding: 4px; background: #ccffcc; }
.col { display: flex; flex-direction: column; }
.col > div { padding: 4px; background: #ffcccc; }
</style></head><body>
<div class="row"><div>A</div><div>B</div><div>C</div></div>
<div class="col"><div>X</div><div>Y</div></div>
